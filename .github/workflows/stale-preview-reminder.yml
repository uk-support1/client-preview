name: Suggest deleting old previews

on:
  schedule:
    - cron: "0 0 1 * *"   # 毎月1日 9:00（日本時間）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find previews older than 3 months
        id: find
        run: |
          set +e
          python3 scripts/find_stale_cases.py > report.md
          code=$?
          set -e
          cat report.md
          if [ "$code" = "0" ]; then echo "stale=true" >> "$GITHUB_OUTPUT"; elif [ "$code" = "2" ]; then echo "stale=false" >> "$GITHUB_OUTPUT"; else exit "$code"; fi
      - name: Open or update the reminder issue
        if: steps.find.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="3か月以上経った確認用ページの削除の提案"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md --assignee uk-support1
          fi
